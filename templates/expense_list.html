<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense View with Pie Chart</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            color: #ff4c4c;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* Styling for the Chart Container */
        #chart-container {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 76, 76, 0.5);
        }

        #expenseChart {
            width: 100%;
            height: auto;
        }

        /* Styling for the Expense Table */
        .expenses-table {
            width: 100%;
            background-color: #1f1f1f;
            color: #fff;
            border-collapse: collapse;
            border: 1px solid #ff4c4c;
        }

        .expenses-table th, .expenses-table td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ff4c4c;
        }

        .expenses-table th {
            background-color: #ff4c4c;
            color: #fff;
        }

        .expenses-table td {
            background-color: #292929;
        }

        /* Buttons */
        .button-group {
            text-align: center;
            margin-top: 30px;
        }

        .button {
            background-color: #ff4c4c;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 1.1rem;
            margin: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            box-shadow: 0px 4px 8px rgba(255, 76, 76, 0.3);
        }

        .button:hover {
            background-color: #e64545;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Expense Overview</h1>

    <div class="grid">
        <!-- Pie Chart Container -->
        <div id="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>

        <!-- Expenses Table -->
        <table class="expenses-table">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Amount (₹)</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for expense in expenses %}
                <tr>
                    <td>{{ expense.get_category_display }}</td>
                    <td>{{ expense.description }}</td>
                    <td>₹{{ expense.amount }}</td>
                    <td>{{ expense.date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Buttons for Add Expense and Back to Dashboard -->
    <div class="button-group">
        <a href="{% url 'add_expense' %}" class="button">Add Expense</a>
        <a href="{% url 'dashboard' %}" class="button">Back to Dashboard</a>
    </div>
</div>

<!-- Load Chart.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Pie Chart Script -->
<script>
    const ctx = document.getElementById('expenseChart').getContext('2d');

    const expenseData = {
        labels: {{ categories|safe }},
        datasets: [{
            label: 'Expenses',
            data: {{ totals|safe }},
            backgroundColor: [
                '#FF4C4C',
                '#FF9F40',
                '#4BC0C0',
                '#36A2EB',
                '#9966FF',
                '#FFCE56'
            ],
            borderColor: '#000',
            borderWidth: 1,
            hoverOffset: 4
        }]
    };

    const config = {
        type: 'pie',
        data: expenseData,
        options: {
            responsive: true,
            animation: {
                animateScale: true,
                animateRotate: true
            },
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(tooltipItem) {
                            return tooltipItem.label + ': ₹' + tooltipItem.raw;
                        }
                    }
                }
            }
        }
    };

    const expenseChart = new Chart(ctx, config);
</script>

</body>
</html>
