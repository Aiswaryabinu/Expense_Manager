<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1f1f1f;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(255, 76, 76, 0.5);
        }

        h1 {
            color: #c00000;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 40px;
        }

        label {
            display: block;
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ff4c4c;
            border-radius: 5px;
            background-color: #292929;
            color: #fff;
            font-size: 1rem;
        }

        input[type="submit"] {
            background-color: #ff4c4c;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0px 4px 8px rgba(255, 76, 76, 0.5);
        }

        input[type="submit"]:hover {
            background-color: #e64545;
        }

        /* Button for Back to Dashboard */
        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        .button {
            background-color: #ff4c4c;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 1.1rem;
            margin-top: 20px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            box-shadow: 0px 4px 8px rgba(255, 76, 76, 0.3);
        }

        .button:hover {
            background-color: #e64545;
            cursor: pointer;
        }

        /* Animation for form */
        .container {
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Add Expense</h1>

    <form method="POST" action="{% url 'add_expense' %}">
        {% csrf_token %}
        <label for="category">Category:</label>
        <select name="category" id="category" required>
            <option value="">Select Category</option>
            <option value="food">Food</option>
            <option value="groceries">Groceries</option>
            <option value="bills">Bills</option>
            <option value="entertainment">Entertainment</option>
            <!-- Add more categories as needed -->
        </select>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description" placeholder="Enter description" required>

        <label for="amount">Amount (₹):</label>
        <input type="number" id="amount" name="amount" placeholder="Enter amount in ₹" required>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>

        <input type="submit" value="Add Expense">
    </form>

    <!-- Button for Back to Dashboard -->
    <div class="button-group">
        <a href="{% url 'dashboard' %}" class="button">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
